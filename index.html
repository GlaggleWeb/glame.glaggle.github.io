<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glame AI Pro</title>
    <link rel="icon" type="image/png" href="favicon.png">

    <meta name="description" content="Chatte mit Glame AI Pro kostenlos und ohne Login wähle zwischen über 5 KI Modellen aus!">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- APPWRITE SDK -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.0"></script>
    
    <style>
        /* --- KLASSISCHES GLAGGLE DESIGN --- */
        :root {
            --bg-color: #f8f9fa;
            --text-color: #202124;
            --nav-bg: #ffffff;
            --card-bg: #ffffff;
            --card-border: #e8eaed;
            --desc-color: #5f6368;
            --input-bg: #ffffff;
            --primary: #007FFF; /* Original Glaggle Blue */
            --danger: #EA4335;
            --glaggle-gradient: linear-gradient(135deg, #4285F4, #EA4335, #FBBC05, #34A853);
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-pill: 30px;
            --shadow-sm: 0 2px 5px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 15px rgba(0, 127, 255, 0.15);
            --shadow-hover: 0 10px 25px rgba(0, 127, 255, 0.25);
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg-color: #202124;
                --text-color: #e8eaed;
                --nav-bg: #303134;
                --card-bg: #303134;
                --card-border: #444444;
                --desc-color: #bdc1c6;
                --input-bg: #3c4043;
                --shadow-md: 0 4px 15px rgba(0,0,0,0.3);
            }
        }

        [data-theme="dark"] {
            --bg-color: #202124;
            --text-color: #e8eaed;
            --nav-bg: #303134;
            --card-bg: #303134;
            --card-border: #444444;
            --desc-color: #bdc1c6;
            --input-bg: #3c4043;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Arial Rounded MT Bold', 'Segoe UI', sans-serif;
            display: flex; 
            flex-direction: column; 
            height: 100vh;
            height: 100dvh; 
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        /* --- MOBILE OPTIMIERUNGEN --- */
        @media (max-width: 768px) {
            #chat-window { padding: 20px 5%; }
            #input-wrapper { padding: 0 5% 20px 5%; }
            .navbar { height: 60px; }
            .nav-title { font-size: 16px; }
            .sidebar { position: absolute; height: 100%; width: 80%; }
        }

        /* --- NAVBAR --- */
        .navbar {
            display: flex; align-items: center; justify-content: space-between;
            height: 70px; background-color: var(--nav-bg); padding: 0 20px;
            box-shadow: var(--shadow-sm); z-index: 1000; border-bottom: 1px solid var(--card-border);
        }
        .nav-btn {
            background: none; border: none; color: var(--text-color);
            font-size: 1.2rem; cursor: pointer; padding: 10px; border-radius: 50%;
            transition: background-color 0.2s, transform 0.1s;
        }
        .nav-btn:hover { background-color: var(--card-border); }
        .nav-btn:active { transform: scale(0.95); }
        .nav-title { font-size: 20px; font-weight: bold; background: var(--glaggle-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .auth-controls { display: flex; align-items: center; gap: 10px; }
        .btn-profile {
            background: var(--card-border); border: none; color: var(--text-color);
            padding: 8px 16px; border-radius: var(--radius-pill); font-weight: bold;
            cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.3s ease;
        }
        .btn-profile:hover { background: var(--primary); color: white; transform: scale(1.05); }

        /* --- LAYOUT --- */
        .app-container { display: flex; flex: 1; overflow: hidden; position: relative; }
        .sidebar {
            width: 300px; background-color: var(--nav-bg); display: flex; flex-direction: column;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 100; padding: 20px; overflow-y: auto;
        }
        #sidebar-left { border-right: 1px solid var(--card-border); }
        #sidebar-right { border-left: 1px solid var(--card-border); }
        .sidebar.collapsed-left { transform: translateX(-100%); position: absolute; height: 100%; }
        .sidebar.collapsed-right { transform: translateX(100%); position: absolute; right: 0; height: 100%; }

        .btn-new-chat {
            background: var(--primary); color: white; border: none; padding: 12px;
            border-radius: var(--radius-pill); font-weight: bold; cursor: pointer; margin-bottom: 20px;
            display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s;
        }
        .btn-new-chat:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }

        /* --- CHAT AREA --- */
        #main-chat { flex: 1; display: flex; flex-direction: column; background: var(--bg-color); min-width: 0; }
        #chat-window { flex: 1; overflow-y: auto; padding: 40px 10%; display: flex; flex-direction: column; gap: 24px; scroll-behavior: smooth; }

        .msg-container { 
            display: flex; 
            width: 100%; 
            animation: messagePop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); 
        }
        .msg-container.user { justify-content: flex-end; }
        
        .bubble {
            max-width: 80%; padding: 18px 24px; line-height: 1.6; font-size: 1rem; position: relative;
            transition: transform 0.2s ease;
        }
        .user .bubble { background: var(--input-bg); border-radius: 24px 24px 4px 24px; border: 1px solid var(--card-border); box-shadow: var(--shadow-sm); }
        .bot .bubble { background: var(--card-bg); border-radius: 24px 24px 24px 4px; border: 1px solid var(--card-border); box-shadow: var(--shadow-md); }
        
        .cursor { display: inline-block; width: 8px; height: 16px; background: var(--primary); margin-left: 4px; animation: blink 0.8s infinite; vertical-align: middle; }
        @keyframes blink { 50% { opacity: 0; } }
        
        @keyframes messagePop { 
            from { opacity: 0; transform: translateY(20px) scale(0.95); } 
            to { opacity: 1; transform: translateY(0) scale(1); } 
        }

        /* --- IMMERSIVE BEGRÜSSUNGEN MIT SCHWEBE-ANIMATION --- */
        .welcome-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; text-align: center; margin: auto 0; padding: 20px;
        }
        
        .welcome-title {
            font-size: 2.8rem; font-weight: 800; background: var(--glaggle-gradient);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 12px;
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1), floatGreeting 6s ease-in-out infinite 0.8s;
        }

        .welcome-subtitle {
            font-size: 1.25rem; color: var(--desc-color); 
            animation: slideUpFade 1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
            max-width: 500px; line-height: 1.5;
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes floatGreeting {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        /* --- FLÜSSIGE BOUNCING LOADING DOTS --- */
        .typing-indicator {
            display: flex; gap: 6px; align-items: center; padding: 12px 20px; background: var(--card-bg);
            border-radius: 20px; border: 1px solid var(--card-border); width: fit-content;
            animation: messagePop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .typing-indicator span {
            width: 8px; height: 8px; background: var(--primary); border-radius: 50%;
            animation: loadingBounce 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes loadingBounce {
            0%, 80%, 100% { transform: scale(0.3); opacity: 0.5; }
            40% { transform: scale(1.1); opacity: 1; }
        }

        /* --- INPUT-BEREICH --- */
        #input-wrapper { padding: 0 10% 40px 10%; background: linear-gradient(to top, var(--bg-color) 70%, transparent); }
        .search-bar-container {
            display: flex; align-items: flex-end; background: var(--input-bg);
            border: 1px solid var(--card-border); border-radius: var(--radius-pill);
            padding: 8px 20px; box-shadow: var(--shadow-md); transition: 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
        }
        .search-bar-container:focus-within { border-color: var(--primary); box-shadow: var(--shadow-hover); }
        #user-input { flex: 1; border: none; outline: none; padding: 12px 0; font-size: 1.1rem; background: transparent; color: var(--text-color); resize: none; max-height: 150px; font-family: inherit; }
        
        /* IMAGE PREVIEW SYSTEM */
        #image-preview-box {
            display: none; position: absolute; bottom: 75px; left: 20px; background: var(--card-bg);
            border: 1px solid var(--card-border); border-radius: var(--radius-md); padding: 8px;
            box-shadow: var(--shadow-hover); z-index: 100; align-items: center; gap: 8px;
            animation: messagePop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #image-preview-box img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }
        #image-preview-box .close-preview { cursor: pointer; color: var(--danger); font-size: 1.1rem; padding: 5px; }

        .icon-btn { background: none; border: none; cursor: pointer; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: var(--desc-color); transition: 0.2s; }
        .icon-btn:hover { background: var(--bg-color); color: var(--primary); transform: scale(1.05); }
        .icon-btn:active { transform: scale(0.95); }
        #mic-btn.active { color: white; background: var(--danger); animation: pulseRed 1s infinite; }
        @keyframes pulseRed { 0% { box-shadow: 0 0 0 0 rgba(234,67,53, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(234,67,53, 0); } 100% { box-shadow: 0 0 0 0 rgba(234,67,53, 0); } }

        .setting-group { margin-bottom: 25px; }
        .setting-label { font-size: 0.85rem; color: var(--desc-color); margin-bottom: 8px; display: block; font-weight: bold; }
        select, .styled-input { width: 100%; background: var(--input-bg); border: 1px solid var(--card-border); color: var(--text-color); padding: 12px; border-radius: var(--radius-md); outline: none; font-family: inherit; transition: all 0.3s ease; }
        select:focus, .styled-input:focus { border-color: var(--primary); }

        /* --- CODE BOX STYLING --- */
        pre {
            background: #1e1e1e !important;
            color: #dcdcdc;
            padding: 15px;
            border-radius: 12px;
            position: relative;
            margin: 15px 0;
            overflow-x: auto;
            border: 1px solid #444;
        }

        code {
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.95rem;
        }

        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .copy-btn:hover { background: var(--primary); }
        .copy-btn.copied { background: #34A853; }

        /* --- AUTH MODAL SYSTEM --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4);
            display: flex; align-items: center; justify-content: center; z-index: 2000; backdrop-filter: blur(8px);
            animation: fadeInModal 0.3s ease;
        }
        .modal-card {
            background: var(--nav-bg); padding: 35px; border-radius: var(--radius-lg); width: 90%; max-width: 400px;
            box-shadow: var(--shadow-hover); position: relative; display: flex; flex-direction: column; gap: 15px;
            border: 1px solid var(--card-border);
            animation: scaleInModal 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .modal-card h2 { margin-bottom: 5px; color: var(--text-color); text-align: center; font-size: 1.6rem; }
        .modal-card p.sub { text-align: center; font-size: 0.85rem; color: var(--desc-color); margin-top: -10px; margin-bottom: 5px; }
        .btn-primary {
            background: var(--primary); color: white; border: none; padding: 14px; border-radius: var(--radius-pill);
            font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 10px; transition: 0.3s;
        }
        .btn-primary:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; transform: none; box-shadow: none; }

        @keyframes fadeInModal { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scaleInModal { from { opacity: 0; transform: scale(0.9) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }

        /* Loading Spinner */
        .loading-spinner {
            display: none; margin: 10px auto;
            border: 3px solid var(--card-border); border-top: 3px solid var(--primary);
            border-radius: 50%; width: 28px; height: 28px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- CANVAS MODE --- */
#main-chat.canvas-active {
    display: flex;
    flex-direction: row;
}
#main-chat.canvas-active #chat-column {
    width: 45%;
    min-width: 320px;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--card-border);
    transition: width 0.3s ease;
}
#chat-column {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-width: 0;
    height: 100%;
}

#canvas-panel {
    width: 55%;
    display: none;
    flex-direction: column;
    background: var(--nav-bg);
    animation: slideInCanvas 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}
#main-chat.canvas-active #canvas-panel { display: flex; }

@keyframes slideInCanvas {
    from { opacity: 0; transform: translateX(30px); }
    to { opacity: 1; transform: translateX(0); }
}

.canvas-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; border-bottom: 1px solid var(--card-border);
    background: var(--card-bg);
}
.canvas-title {
    display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 0.95rem;
}
.canvas-title i { color: var(--primary); }
.canvas-actions { display: flex; gap: 6px; }

.canvas-body {
    flex: 1; overflow: hidden; display: flex; flex-direction: column; position: relative;
}
.canvas-tabs {
    display: flex; gap: 4px; padding: 8px 20px 0 20px; background: var(--card-bg);
    border-bottom: 1px solid var(--card-border);
}
.canvas-tab {
    padding: 8px 16px; border-radius: 10px 10px 0 0; cursor: pointer; font-size: 0.85rem;
    color: var(--desc-color); border: 1px solid transparent; border-bottom: none;
}
.canvas-tab.active {
    background: var(--bg-color); color: var(--primary); font-weight: bold;
    border-color: var(--card-border);
}

.canvas-code-view {
    flex: 1; overflow: auto; padding: 20px; background: #1e1e1e; margin: 0;
}
.canvas-code-view pre { margin: 0; box-shadow: none; }

.canvas-preview-frame {
    flex: 1; border: none; width: 100%; background: white; display: none;
}
.canvas-story-view {
    flex: 1; overflow: auto; padding: 30px 40px; background: var(--bg-color);
    line-height: 1.8; font-size: 1.05rem;
}

/* --- FILE CARD IM CHATVERLAUF --- */
.canvas-file-card {
    display: flex; align-items: center; gap: 14px; background: var(--card-bg);
    border: 1px solid var(--card-border); border-radius: var(--radius-md);
    padding: 14px 18px; cursor: pointer; transition: 0.2s; max-width: 320px;
    box-shadow: var(--shadow-sm);
}
.canvas-file-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-md); }
.canvas-file-icon {
    width: 42px; height: 42px; border-radius: 10px; background: rgba(0,127,255,0.12);
    color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0;
}
.canvas-file-info { min-width: 0; }
.canvas-file-title { font-weight: bold; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.canvas-file-sub { font-size: 0.75rem; color: var(--desc-color); }

@media (max-width: 768px) {
    #main-chat.canvas-active { flex-direction: column; }
    #main-chat.canvas-active #chat-column { width: 100%; height: 40%; border-right: none; border-bottom: 1px solid var(--card-border); }
    #main-chat.canvas-active #canvas-panel { width: 100%; height: 60%; }
}

.bot .bubble, .user .bubble {
    width: auto;
    max-width: 80%;
    min-width: 120px; /* verhindert das "Wort-Turm"-Problem bei kurzen Zwischenständen */
}
        
.bubble p { margin: 0 0 8px 0; }
.bubble p:last-child { margin-bottom: 0; }
.bubble ul, .bubble ol { margin: 8px 0; padding-left: 20px; }
.bubble { min-width: 0; }
#chat-window { min-width: 0; }
/* --- TRIP CARDS --- */
.trip-wrapper { display: flex; flex-direction: column; gap: 14px; }

.trip-day-tabs {
    display: flex; gap: 8px; flex-wrap: wrap;
}
.trip-day-tab {
    background: var(--input-bg); border: 1px solid var(--card-border);
    color: var(--desc-color); padding: 8px 16px; border-radius: var(--radius-pill);
    font-size: 0.85rem; cursor: pointer; font-family: inherit; transition: 0.2s;
}
.trip-day-tab.active, .trip-day-tab:hover {
    background: var(--primary); color: white; border-color: var(--primary);
}

.trip-day-panel { display: flex; flex-direction: column; gap: 12px; }
.trip-day-title { font-weight: bold; font-size: 1rem; color: var(--text-color); }

.trip-stops { display: flex; flex-direction: column; gap: 10px; }

.trip-stop-card {
    display: flex; gap: 14px; background: var(--bg-color);
    border: 1px solid var(--card-border); border-radius: var(--radius-md);
    padding: 12px; align-items: center;
}
.trip-stop-img {
    width: 90px; height: 90px; border-radius: 12px; overflow: hidden;
    flex-shrink: 0; background: var(--card-border);
    display: flex; align-items: center; justify-content: center;
}
.trip-stop-img img { width: 100%; height: 100%; object-fit: cover; }
.trip-stop-img-placeholder { color: var(--desc-color); font-size: 1.4rem; }

.trip-stop-info { min-width: 0; }
.trip-stop-time {
    font-size: 0.75rem; color: var(--primary); font-weight: bold; margin-bottom: 3px;
}
.trip-stop-name { font-weight: bold; font-size: 0.95rem; margin-bottom: 4px; }
.trip-stop-desc { font-size: 0.85rem; color: var(--desc-color); line-height: 1.4; }

/* --- RECIPE CARDS --- */
.recipe-wrapper {
    display: flex; flex-direction: column; border-radius: var(--radius-lg);
    overflow: hidden; border: 1px solid var(--card-border); background: var(--bg-color);
}
.recipe-hero {
    width: 100%; height: 180px; background: var(--card-border);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.recipe-hero img { width: 100%; height: 100%; object-fit: cover; }

.recipe-body { padding: 18px; }
.recipe-title { color: var(--primary); margin-bottom: 8px; }
.recipe-meta {
    display: flex; gap: 16px; font-size: 0.85rem; color: var(--desc-color); margin-bottom: 16px;
}
.recipe-meta i { color: var(--primary); margin-right: 5px; }

.recipe-columns {
    display: flex; gap: 24px; flex-wrap: wrap;
}
.recipe-ingredients, .recipe-steps { flex: 1; min-width: 200px; }
.recipe-ingredients h4, .recipe-steps h4 {
    font-size: 0.9rem; color: var(--text-color); margin-bottom: 10px;
    border-bottom: 2px solid var(--primary); padding-bottom: 6px; display: inline-block;
}
.recipe-ingredients ul { padding-left: 18px; line-height: 1.9; font-size: 0.9rem; }
.recipe-steps ol { padding-left: 18px; line-height: 1.9; font-size: 0.9rem; }

@media (max-width: 768px) {
    .recipe-columns { flex-direction: column; }
    .trip-stop-card { flex-direction: row; }
}
    </style>
</head>
<body data-theme="auto">

<nav class="navbar">
    <button class="nav-btn" onclick="toggleSidebar('sidebar-left')"><i class="fas fa-bars"></i></button>
    <div class="nav-title"><img src="glamelogo.png" alt="Glame Pro" style="height: 102px; vertical-align: middle;"></div>
    <div class="auth-controls">
        <button class="btn-profile" id="user-profile-btn" onclick="openAuthModal()">
            <i class="fas fa-user-circle"></i> Login
        </button>
        <button class="nav-btn" onclick="toggleSidebar('sidebar-right')"><i class="fas fa-sliders-h"></i></button>
    </div>
</nav>

    <div class="app-container">
        <aside class="sidebar collapsed-left" id="sidebar-left">
            <button class="btn-new-chat" onclick="createNewChat()"><i class="fas fa-plus"></i> Neuer Chat</button>
            <div id="chat-list"></div>
        </aside>
<main id="main-chat">
    <div id="chat-column">
        <div id="chat-window"></div>

        <div id="input-wrapper">
            <div class="search-bar-container">
                <!-- Bildvorschau -->
                <div id="image-preview-box">
                    <img id="image-preview-img" src="" alt="Vorschau">
                    <i class="fas fa-times-circle close-preview" onclick="clearImage()"></i>
                </div>

                <!-- Hidden File Input für Bilder -->
                <input type="file" id="image-file-input" accept="image/*" style="display: none;" onchange="handleImageSelection(event)">
                
                <button class="icon-btn" onclick="document.getElementById('image-file-input').click()" title="Bild anhängen">
                    <i class="fas fa-paperclip"></i>
                </button>
                
                <textarea id="user-input" placeholder="Ask Glame..." rows="1"></textarea>
                
                <button class="icon-btn" id="mic-btn"><i class="fas fa-microphone"></i></button>
                <button class="icon-btn" id="send-btn" style="color: var(--primary)"><i class="fas fa-paper-plane"></i></button>
            </div>

    async function syncChatsToCloud() {
        if (!currentUser) return;
        const chatIds = Object.keys(allChats).sort((a,b) => allChats[b].date - allChats[a].date).slice(0, 3);
        
        try {
            const response = await databases.listDocuments(DB_ID, COLL_CHATS, [
                Appwrite.Query.equal('userId', currentUser.$id)
            ]);

            const existingDocs = {};
            response.documents.forEach(doc => existingDocs[doc.chatId] = doc.$id);

            for (const id of chatIds) {
                const data = {
                    userId: currentUser.$id,
                    chatId: id,
                    title: allChats[id].title,
                    messages: JSON.stringify(allChats[id].messages),
                    timestamp: allChats[id].date
                };

                if (existingDocs[id]) {
                    await databases.updateDocument(DB_ID, COLL_CHATS, existingDocs[id], data);
                    delete existingDocs[id];
                } else {
                    await databases.createDocument(DB_ID, COLL_CHATS, Appwrite.ID.unique(), data);
                }
            }

            for (const docId of Object.values(existingDocs)) {
                await databases.deleteDocument(DB_ID, COLL_CHATS, docId);
            }
        } catch (e) {
            console.warn("Cloud-Sync fehlgeschlagen.", e);
        }
    }

    let currentTypingElement = null;

    function initTypewriter(element) {
        currentTypingElement = element;
        fullTypingContent = "";
        displayedText = "";
        typingQueue = "";
        isTypingActive = true;
        animateTypewriter();
    }

    function feedTypewriter(text) {
        typingQueue += text;
        fullTypingContent += text;
    }

    function animateTypewriter() {
        if (!isTypingActive) return;

        if (typingQueue.length > 0) {
            const speed = typingQueue.length > 30 ? 2 : (typingQueue.length > 10 ? 5 : 12);
            
            const charToType = typingQueue.substring(0, 1);
            typingQueue = typingQueue.substring(1);
            displayedText += charToType;
            
            updateBubbleContent(currentTypingElement, displayedText + ' <span class="cursor"></span>');
            
            setTimeout(animateTypewriter, speed);
        } else {
            setTimeout(animateTypewriter, 20);
        }
    }

    async function flushTypewriter(finalText) {
        isTypingActive = false;
        updateBubbleContent(currentTypingElement, finalText);

async function fetchWikimediaImage(query, bubbleElement) {
    try {
        // User-Agent im Query-String integriert, um CORS-Preflight-Probleme im Browser zu vermeiden
        const projectAgent = "Glame_AI_Pro_1.0_(https_glaggle_ch;_info_glaggle_ch)";

        // 1. Suche nach dem passenden Dateinamen
        const searchUrl = `https://commons.wikimedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&srnamespace=6&format=json&origin=*&srlimit=1&useragent=${projectAgent}`;
        const searchRes = await fetch(searchUrl);
        const searchData = await searchRes.json();

        if (!searchData.query || !searchData.query.search || !searchData.query.search.length) return;

        const fileTitle = searchData.query.search[0].title;

        // 2. Thumbnail-Grösse, Metadaten und Beschreibungs-URL anfordern
        const infoUrl = `https://commons.wikimedia.org/w/api.php?action=query&titles=${encodeURIComponent(fileTitle)}&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=500&format=json&origin=*&useragent=${projectAgent}`;
        const infoRes = await fetch(infoUrl);
        const infoData = await infoRes.json();

        const pages = infoData.query.pages;
        if (!pages) return;

        const page = Object.values(pages)[0];
        if (!page || !page.imageinfo || !page.imageinfo.length) return;

        // Nutzen der erlaubten Thumbnail-URL
        const imageUrl = page.imageinfo[0].thumburl || page.imageinfo[0].url;
        
        // Korrigierter Fallback-Link zur Wikimedia-Original-Beschreibungsseite
        const descriptionUrl = page.imageinfo[0].descriptionurl || `https://wikimedia.org{encodeURIComponent(fileTitle)}`;
        
        const meta = page.imageinfo[0].extmetadata || {};

        // HTML aus Autor filtern und Fallback verbessern
        let author = meta.Artist ? meta.Artist.value.replace(/<[^>]*>/g, "").trim() : "Unbekannt";
        if (!author || author.length > 100) author = "Unbekannt"; // Verhindert gesprengte Layouts durch ellenlange Lizenztexte im Artist-Feld

        const license = meta.LicenseShortName ? meta.LicenseShortName.value : "Freie Lizenz";

        // Sauber formatiertes Datei-Label für die Anzeige (entfernt "File:" / "Datei:")
        const displayTitle = fileTitle.replace(/^(File:|Datei:)/i, "");

        // 3. Element im Chat mit funktionierenden Links anzeigen
        const wrapper = document.createElement("div");
        wrapper.style.marginTop = "15px";
        wrapper.innerHTML = `
            <a href="${descriptionUrl}" target="_blank" rel="noopener noreferrer" style="display: block; line-height: 0;">
                <img src="${imageUrl}" style="max-width:100%; border-radius:12px; box-shadow: var(--shadow-sm); cursor: pointer;" alt="${query.replace(/"/g, '&quot;')}">
            </a>
            <p style="font-size:0.75rem; color: var(--desc-color); margin-top:6px; line-height: 1.4;">
                <strong>Bild:</strong> <a href="${descriptionUrl}" target="_blank" rel="noopener noreferrer" style="color: inherit; text-decoration: underline;">${displayTitle}</a><br>
                <strong>Foto:</strong> ${author} · 
                <strong>Lizenz:</strong> <a href="${descriptionUrl}" target="_blank" rel="noopener noreferrer" style="color: inherit; text-decoration: underline;">${license}</a> (via Wikimedia Commons)
            </p>
        `;
        bubbleElement.appendChild(wrapper);
        
        if (typeof chatWindow !== "undefined") {
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }
    } catch (e) {
        console.warn("Wikimedia-Bildsuche fehlgeschlagen:", e);
    }
}

function parseSuggestions(text) {
    const match = text.match(/\[SUGGEST:\s*(.+?)\]\s*$/i);
    if (!match) return { cleanedText: text, suggestions: [] };
    
    const suggestions = match[1].split("|").map(s => s.trim()).filter(Boolean);
    const cleanedText = text.replace(/\[SUGGEST:\s*.+?\]\s*$/i, "").trim();
    return { cleanedText, suggestions };
}

            `;
            optBtn.onclick = () => {
                if (userAnswers[qIndex] !== null) return; // schon beantwortet
                userAnswers[qIndex] = oIndex;

                const allOptBtns = optsWrapper.querySelectorAll('button');
                allOptBtns.forEach((b, i) => {

let canvasState = { open: false, type: null, content: "", language: "", title: "" };
let canvasFileCounter = 0;

function detectCanvasContent(text) {
    const codeBlockRegex = /```(\w+)?\n([\s\S]*?)```/g;
    let match;
    let biggestCode = null;

    while ((match = codeBlockRegex.exec(text)) !== null) {
        const lang = match[1] || "text";
        const code = match[2];
        const lineCount = code.split("\n").length;
        if (!biggestCode || lineCount > biggestCode.lineCount) {
            biggestCode = { lang, code, lineCount };
        }
    }

    if (biggestCode) {
        const code = biggestCode.code;
        const lang = biggestCode.lang.toLowerCase();

        // Vollständiges HTML-Dokument -> immer Canvas
        const isFullHtmlDoc = lang === "html" && /<!DOCTYPE|<html[\s>]/i.test(code);

        // Mehrere Funktionen/Klassen zählen (grobe Heuristik über gängige Sprachen)
        const funcMatches = code.match(/\bfunction\s+\w+\s*\(|=>\s*{|\bdef\s+\w+\s*\(|\bclass\s+\w+/g) || [];
        const hasMultipleFunctions = funcMatches.length >= 2;

        // Canvas nur bei: komplettes HTML-Programm ODER langer Code (>25 Zeilen) ODER mehrere Funktionen
        const isFullProgram = isFullHtmlDoc || biggestCode.lineCount > 25 || hasMultipleFunctions;

        if (isFullProgram) {
            return { type: "code", language: biggestCode.lang, content: code };
        }
        // Sonst: kein Canvas, Code bleibt normal im Chat (return null fällt durch zur Story-Prüfung, aber Code soll NICHT als Story erkannt werden)
        return null;
    }

    // Geschichten-Erkennung bleibt gleich
    const plainText = text.replace(/```[\s\S]*?```/g, "").trim();
    const wordCount = plainText.split(/\s+/).length;
    const looksLikeStory = wordCount > 250 && !plainText.includes("|") && (plainText.match(/\n\n/g) || []).length >= 2;

    if (looksLikeStory) {
        return { type: "story", language: null, content: plainText };
    }

    return null;
}

    const codeView = document.getElementById("canvas-code-view");

    const tabs = document.getElementById("canvas-tabs");

    if (data.type === "code") {

        codeEl.textContent = data.content;
        if (window.Prism) Prism.highlightElement(codeEl);

        // Vorschau nur bei HTML sinnvoll
        if (data.language === "html") {
            tabs.style.display = "flex";
            previewFrame.srcdoc = data.content;
        } else {
            tabs.style.display = "none";
            previewFrame.style.display = "none";
            codeView.style.display = "block";
        }
    } else {
        codeView.style.display = "none";
        previewFrame.style.display = "none";
        tabs.style.display = "none";
        storyView.style.display = "block";
        storyView.innerHTML = marked.parse(data.content);
    }
}

function switchCanvasView(view) {
    document.querySelectorAll(".canvas-tab").forEach(t => t.classList.toggle("active", t.dataset.view === view));
    const codeView = document.getElementById("canvas-code-view");
    const previewFrame = document.getElementById("canvas-preview-frame");

    if (view === "preview") {
        codeView.style.display = "none";
        previewFrame.style.display = "block";
    } else {
        codeView.style.display = "block";
        previewFrame.style.display = "none";
    }
}

// Schliessen: Inhalt wird als Datei-Karte im Chat "eingefroren"
function closeCanvas() {
    if (!canvasState.open) return;

    // Datei-Karte in den letzten Bot-Bubble injizieren (falls noch nicht vorhanden)
    if (currentTypingElement && !currentTypingElement.querySelector(".canvas-file-card")) {
        insertCanvasFileCard(currentTypingElement, canvasState);
    }

    document.getElementById("main-chat").classList.remove("canvas-active");
    canvasState = { open: false, type: null, content: "", language: "", title: "" };
}

function insertCanvasFileCard(bubbleElement, data) {
    canvasFileCounter++;
    const fileId = "canvasfile_" + Date.now() + "_" + canvasFileCounter;

    // Inhalt für spätere Wiederherstellung im DOM speichern (data-Attribut, JSON-escaped)
    const card = document.createElement("div");
    card.className = "canvas-file-card";
    card.id = fileId;
    card.dataset.canvasType = data.type;
    card.dataset.canvasLang = data.language || "";
    card.dataset.canvasTitle = data.title;
    card.dataset.canvasContent = encodeURIComponent(data.content);

    const iconClass = data.type === "code" ? "fa-code" : "fa-book-open";
    const subLabel = data.type === "code" ? (data.language || "code").toUpperCase() : "Geschichte";

    card.innerHTML = `
        <div class="canvas-file-icon"><i class="fas ${iconClass}"></i></div>
        <div class="canvas-file-info">
            <div class="canvas-file-title">${data.title}</div>
            <div class="canvas-file-sub">${subLabel} · Canvas öffnen</div>
        </div>
    `;
    card.onclick = () => {
        const restored = {
            type: card.dataset.canvasType,
            language: card.dataset.canvasLang,
            content: decodeURIComponent(card.dataset.canvasContent)
        };
        openCanvas(restored, card.dataset.canvasTitle);
    };

    bubbleElement.appendChild(card);
}

function copyCanvasContent() {
    navigator.clipboard.writeText(canvasState.content).then(() => {
        const btn = event.currentTarget;
        const original = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-check"></i>';
        setTimeout(() => btn.innerHTML = original, 1500);
    });
}

function downloadCanvasContent() {
    const extMap = { html: "html", javascript: "js", python: "py", css: "css", json: "json", java: "java", cpp: "cpp", c: "c", php: "php", sql: "sql" };
    const ext = canvasState.type === "code" ? (extMap[canvasState.language] || "txt") : "md";
    const blob = new Blob([canvasState.content], { type: "text/plain" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${canvasState.title.replace(/\s+/g, "_")}.${ext}`;
    a.click();
    URL.revokeObjectURL(url);
}

// ==========================================
// TRIP CARDS (Reiseplaner)
// ==========================================
function parseAndRenderTrip(text, bubbleElement) {
    const match = text.match(/\[TRIP\]([\s\S]*?)(\[\/TRIP\]|$)/i);
    if (!match) return false;

    let tripData;
    try {
        let raw = match[1].trim();
        // Falls das Modell trotzdem einen schließenden Tag mitschickt, sauber abschneiden
        raw = raw.replace(/\[\/TRIP\]\s*$/i, "").trim();
        tripData = JSON.parse(raw);
    } catch (e) {
        console.error("Trip-Parsing fehlgeschlagen", e);
        return false;
    }

    bubbleElement.innerHTML = "";
    const wrapper = document.createElement("div");
    wrapper.className = "trip-wrapper";

    const title = document.createElement("h3");
    title.innerHTML = `✈️ ${tripData.destination}`;
    title.style.cssText = "color: var(--primary); margin-bottom: 16px;";
    wrapper.appendChild(title);

    const tabsBar = document.createElement("div");
    tabsBar.className = "trip-day-tabs";

    const dayPanels = document.createElement("div");

    (tripData.days || []).forEach((day, idx) => {
        const tab = document.createElement("button");
        tab.className = "trip-day-tab" + (idx === 0 ? " active" : "");
        tab.textContent = day.day;
        tab.onclick = () => {
            wrapper.querySelectorAll(".trip-day-tab").forEach(t => t.classList.remove("active"));
            tab.classList.add("active");
            wrapper.querySelectorAll(".trip-day-panel").forEach(p => p.style.display = "none");
            panel.style.display = "flex";
        };
        tabsBar.appendChild(tab);

        const panel = document.createElement("div");
        panel.className = "trip-day-panel";
        panel.style.display = idx === 0 ? "flex" : "none";

        if (day.title) {
            const dayTitle = document.createElement("div");
            dayTitle.className = "trip-day-title";
            dayTitle.textContent = day.title;
            panel.appendChild(dayTitle);
        }

        const stopsList = document.createElement("div");
        stopsList.className = "trip-stops";

        (day.stops || []).forEach(stop => {
            const stopCard = document.createElement("div");
            stopCard.className = "trip-stop-card";
            stopCard.innerHTML = `
                <div class="trip-stop-img" data-query="${(stop.img || stop.name).replace(/"/g, '&quot;')}">
                    <div class="trip-stop-img-placeholder"><i class="fas fa-image"></i></div>
                </div>
                <div class="trip-stop-info">
                    ${stop.time ? `<div class="trip-stop-time">${stop.time}</div>` : ""}
                    <div class="trip-stop-name">${stop.name}</div>
                    ${stop.desc ? `<div class="trip-stop-desc">${stop.desc}</div>` : ""}
                </div>
            `;
            stopsList.appendChild(stopCard);

            // Bild asynchron nachladen
            const imgSlot = stopCard.querySelector(".trip-stop-img");
            fetchWikimediaThumbnail(stop.img || stop.name, imgSlot);
        });

        panel.appendChild(stopsList);
        dayPanels.appendChild(panel);
    });

    wrapper.appendChild(tabsBar);
    wrapper.appendChild(dayPanels);
    bubbleElement.appendChild(wrapper);
    chatWindow.scrollTop = chatWindow.scrollHeight;
    return true;
}

// Leichtgewichtige Variante von fetchWikimediaImage: lädt nur das Thumbnail in ein Ziel-Element
async function fetchWikimediaThumbnail(query, targetEl) {
    try {
        const projectAgent = "Glame_AI_Pro_1.0_(https_glaggle_ch;_info_glaggle_ch)";
        const searchUrl = `https://commons.wikimedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&srnamespace=6&format=json&origin=*&srlimit=1&useragent=${projectAgent}`;
        const searchRes = await fetch(searchUrl);
        const searchData = await searchRes.json();

        if (!searchData.query || !searchData.query.search || !searchData.query.search.length) return;
        const fileTitle = searchData.query.search[0].title;

        const infoUrl = `https://commons.wikimedia.org/w/api.php?action=query&titles=${encodeURIComponent(fileTitle)}&prop=imageinfo&iiprop=url&iiurlwidth=400&format=json&origin=*&useragent=${projectAgent}`;
        const infoRes = await fetch(infoUrl);
        const infoData = await infoRes.json();

        const pages = infoData.query.pages;
        if (!pages) return;
        const page = Object.values(pages)[0];
        if (!page || !page.imageinfo || !page.imageinfo.length) return;

        const imageUrl = page.imageinfo[0].thumburl || page.imageinfo[0].url;
        targetEl.innerHTML = `<img src="${imageUrl}" alt="${query.replace(/"/g, '&quot;')}" loading="lazy">`;
    } catch (e) {
        console.warn("Thumbnail-Ladefehler:", e);
    }
}

// ==========================================
// RECIPE CARDS (Rezepte)
// ==========================================
function parseAndRenderRecipe(text, bubbleElement) {
    const match = text.match(/\[RECIPE\]([\s\S]*?)(\[\/RECIPE\]|$)/i);
    if (!match) return false;

    let r;
    try {
        let raw = match[1].trim().replace(/\[\/RECIPE\]\s*$/i, "").trim();
        r = JSON.parse(raw);
    } catch (e) {
        console.error("Rezept-Parsing fehlgeschlagen", e);
        return false;
    }

    bubbleElement.innerHTML = "";
    const wrapper = document.createElement("div");
    wrapper.className = "recipe-wrapper";

    wrapper.innerHTML = `
        <div class="recipe-hero" id="recipe-hero-img">
            <div class="trip-stop-img-placeholder"><i class="fas fa-utensils"></i></div>
        </div>
        <div class="recipe-body">
            <h3 class="recipe-title">🍽️ ${r.title}</h3>
            <div class="recipe-meta">
                ${r.time ? `<span><i class="fas fa-clock"></i> ${r.time}</span>` : ""}
                ${r.servings ? `<span><i class="fas fa-users"></i> ${r.servings} Portionen</span>` : ""}
            </div>
            <div class="recipe-columns">
                <div class="recipe-ingredients">
                    <h4>Zutaten</h4>
                    <ul>${(r.ingredients || []).map(i => `<li>${i}</li>`).join("")}</ul>
                </div>
                <div class="recipe-steps">
                    <h4>Zubereitung</h4>
                    <ol>${(r.steps || []).map(s => `<li>${s}</li>`).join("")}</ol>
                </div>
            </div>
        </div>
    `;

    bubbleElement.appendChild(wrapper);
    fetchWikimediaThumbnail(r.img || r.title, document.getElementById("recipe-hero-img"));
    chatWindow.scrollTop = chatWindow.scrollHeight;
    return true;
}
