<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glame AI Pro</title>
    <link rel="icon" type="image/png" href="favicon.png">

    <meta name="description" content="Chatte mit Glame AI Pro kostenlos und ohne Login wähle zwischen über 5 KI Modellen aus!">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- APPWRITE SDK -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.0"></script>
    
    <style>
        /* --- KLASSISCHES GLAGGLE DESIGN --- */
        :root {
            --bg-color: #f8f9fa;
            --text-color: #202124;
            --nav-bg: #ffffff;
            --card-bg: #ffffff;
            --card-border: #e8eaed;
            --desc-color: #5f6368;
            --input-bg: #ffffff;
            --primary: #007FFF; /* Original Glaggle Blue */
            --danger: #EA4335;
            --glaggle-gradient: linear-gradient(135deg, #4285F4, #EA4335, #FBBC05, #34A853);
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-pill: 30px;
            --shadow-sm: 0 2px 5px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 15px rgba(0, 127, 255, 0.15);
            --shadow-hover: 0 10px 25px rgba(0, 127, 255, 0.25);
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg-color: #202124;
                --text-color: #e8eaed;
                --nav-bg: #303134;
                --card-bg: #303134;
                --card-border: #444444;
                --desc-color: #bdc1c6;
                --input-bg: #3c4043;
                --shadow-md: 0 4px 15px rgba(0,0,0,0.3);
            }
        }

        [data-theme="dark"] {
            --bg-color: #202124;
            --text-color: #e8eaed;
            --nav-bg: #303134;
            --card-bg: #303134;
            --card-border: #444444;
            --desc-color: #bdc1c6;
            --input-bg: #3c4043;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Arial Rounded MT Bold', 'Segoe UI', sans-serif;
            display: flex; 
            flex-direction: column; 
            height: 100vh;
            height: 100dvh; 
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        /* --- MOBILE OPTIMIERUNGEN --- */
        @media (max-width: 768px) {
            #chat-window { padding: 20px 5%; }
            #input-wrapper { padding: 0 5% 20px 5%; }
            .navbar { height: 60px; }
            .nav-title { font-size: 16px; }
            .sidebar { position: absolute; height: 100%; width: 80%; }
        }

        /* --- NAVBAR --- */
        .navbar {
            display: flex; align-items: center; justify-content: space-between;
            height: 70px; background-color: var(--nav-bg); padding: 0 20px;
            box-shadow: var(--shadow-sm); z-index: 1000; border-bottom: 1px solid var(--card-border);
        }
        .nav-btn {
            background: none; border: none; color: var(--text-color);
            font-size: 1.2rem; cursor: pointer; padding: 10px; border-radius: 50%;
            transition: background-color 0.2s, transform 0.1s;
        }
        .nav-btn:hover { background-color: var(--card-border); }
        .nav-btn:active { transform: scale(0.95); }
        .nav-title { font-size: 20px; font-weight: bold; background: var(--glaggle-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .auth-controls { display: flex; align-items: center; gap: 10px; }
        .btn-profile {
            background: var(--card-border); border: none; color: var(--text-color);
            padding: 8px 16px; border-radius: var(--radius-pill); font-weight: bold;
            cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.3s ease;
        }
        .btn-profile:hover { background: var(--primary); color: white; transform: scale(1.05); }

        /* --- LAYOUT --- */
        .app-container { display: flex; flex: 1; overflow: hidden; position: relative; }
        .sidebar {
            width: 300px; background-color: var(--nav-bg); display: flex; flex-direction: column;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 100; padding: 20px; overflow-y: auto;
        }
        #sidebar-left { border-right: 1px solid var(--card-border); }
        #sidebar-right { border-left: 1px solid var(--card-border); }
        .sidebar.collapsed-left { transform: translateX(-100%); position: absolute; height: 100%; }
        .sidebar.collapsed-right { transform: translateX(100%); position: absolute; right: 0; height: 100%; }

        .btn-new-chat {
            background: var(--primary); color: white; border: none; padding: 12px;
            border-radius: var(--radius-pill); font-weight: bold; cursor: pointer; margin-bottom: 20px;
            display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s;
        }
        .btn-new-chat:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }

        /* --- CHAT AREA --- */
        #main-chat { flex: 1; display: flex; flex-direction: row; background: var(--bg-color); min-width: 0; }
        
        #chat-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            transition: all 0.3s ease;
        }
        
        #main-chat.canvas-inactive #chat-column {
            width: 100%;
        }
        
        #main-chat.canvas-active #chat-column {
            width: 45%;
            border-right: 1px solid var(--card-border);
        }

        #chat-window { flex: 1; overflow-y: auto; padding: 40px 10%; display: flex; flex-direction: column; gap: 24px; scroll-behavior: smooth; }

        .msg-container { 
            display: flex; 
            width: 100%; 
            animation: messagePop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); 
        }
        .msg-container.user { justify-content: flex-end; }
        
        .bubble {
            max-width: 80%; padding: 18px 24px; line-height: 1.6; font-size: 1rem; position: relative;
            transition: transform 0.2s ease;
        }
        .user .bubble { background: var(--input-bg); border-radius: 24px 24px 4px 24px; border: 1px solid var(--card-border); box-shadow: var(--shadow-sm); }
        .bot .bubble { background: var(--card-bg); border-radius: 24px 24px 24px 4px; border: 1px solid var(--card-border); box-shadow: var(--shadow-md); }
        
        .cursor { display: inline-block; width: 8px; height: 16px; background: var(--primary); margin-left: 4px; animation: blink 0.8s infinite; vertical-align: middle; }
        @keyframes blink { 50% { opacity: 0; } }
        
        @keyframes messagePop { 
            from { opacity: 0; transform: translateY(20px) scale(0.95); } 
            to { opacity: 1; transform: translateY(0) scale(1); } 
        }

        /* --- IMMERSIVE BEGRÜSSUNGEN MIT SCHWEBE-ANIMATION --- */
        .welcome-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; text-align: center; margin: auto 0; padding: 20px;
        }
        
        .welcome-title {
            font-size: 2.8rem; font-weight: 800; background: var(--glaggle-gradient);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 12px;
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1), floatGreeting 6s ease-in-out infinite 0.8s;
        }

        .welcome-subtitle {
            font-size: 1.25rem; color: var(--desc-color); 
            animation: slideUpFade 1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
            max-width: 500px; line-height: 1.5;
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes floatGreeting {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        /* --- FLÜSSIGE BOUNCING LOADING DOTS --- */
        .typing-indicator {
            display: flex; gap: 6px; align-items: center; padding: 12px 20px; background: var(--card-bg);
            border-radius: 20px; border: 1px solid var(--card-border); width: fit-content;
            animation: messagePop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .typing-indicator span {
            width: 8px; height: 8px; background: var(--primary); border-radius: 50%;
            animation: loadingBounce 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes loadingBounce {
            0%, 80%, 100% { transform: scale(0.3); opacity: 0.5; }
            40% { transform: scale(1.1); opacity: 1; }
        }

        /* --- INPUT-BEREICH --- */
        #input-wrapper { padding: 0 10% 40px 10%; background: linear-gradient(to top, var(--bg-color) 70%, transparent); }
        .search-bar-container {
            display: flex; align-items: flex-end; background: var(--input-bg);
            border: 1px solid var(--card-border); border-radius: var(--radius-pill);
            padding: 8px 20px; box-shadow: var(--shadow-md); transition: 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
        }
        .search-bar-container:focus-within { border-color: var(--primary); box-shadow: var(--shadow-hover); }
        #user-input { flex: 1; border: none; outline: none; padding: 12px 0; font-size: 1.1rem; background: transparent; color: var(--text-color); resize: none; max-height: 150px; font-family: inherit; }
        
        /* IMAGE PREVIEW SYSTEM */
        #image-preview-box {
            display: none; position: absolute; bottom: 75px; left: 20px; background: var(--card-bg);
            border: 1px solid var(--card-border); border-radius: var(--radius-md); padding: 8px;
            box-shadow: var(--shadow-hover); z-index: 100; align-items: center; gap: 8px;
            animation: messagePop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #image-preview-box img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }
        #image-preview-box .close-preview { cursor: pointer; color: var(--danger); font-size: 1.1rem; padding: 5px; }

        .icon-btn { background: none; border: none; cursor: pointer; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: var(--text-color); transition: 0.2s; }
        .icon-btn:hover { background: var(--bg-color); color: var(--primary); transform: scale(1.05); }
        .icon-btn:active { transform: scale(0.95); }
        #mic-btn.active { color: white; background: var(--danger); animation: pulseRed 1s infinite; }
        @keyframes pulseRed { 0% { box-shadow: 0 0 0 0 rgba(234,67,53, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(234,67,53, 0); } 100% { box-shadow: 0 0 0 0 rgba(234,67,53, 0); } }

        .setting-group { margin-bottom: 25px; }
        .setting-label { font-size: 0.85rem; color: var(--desc-color); margin-bottom: 8px; display: block; font-weight: bold; }
        select, .styled-input { width: 100%; background: var(--input-bg); border: 1px solid var(--card-border); color: var(--text-color); padding: 12px; border-radius: var(--radius-md); outline: none; transition: 0.2s; }
        select:focus, .styled-input:focus { border-color: var(--primary); }

        /* --- CODE BOX STYLING --- */
        pre {
            background: #1e1e1e !important;
            color: #dcdcdc;
            padding: 15px;
            border-radius: 12px;
            position: relative;
            margin: 15px 0;
            overflow-x: auto;
            border: 1px solid #444;
        }

        code {
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.95rem;
        }

        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .copy-btn:hover { background: var(--primary); }
        .copy-btn.copied { background: #34A853; }

        /* --- AUTH MODAL SYSTEM --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4);
            display: flex; align-items: center; justify-content: center; z-index: 2000; backdrop-filter: blur(8px);
            animation: fadeInModal 0.3s ease;
        }
        .modal-card {
            background: var(--nav-bg); padding: 35px; border-radius: var(--radius-lg); width: 90%; max-width: 400px;
            box-shadow: var(--shadow-hover); position: relative; display: flex; flex-direction: column; gap: 15px;
            border: 1px solid var(--card-border);
            animation: scaleInModal 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .modal-card h2 { margin-bottom: 5px; color: var(--text-color); text-align: center; font-size: 1.6rem; }
        .modal-card p.sub { text-align: center; font-size: 0.85rem; color: var(--desc-color); margin-top: -10px; margin-bottom: 5px; }
        .btn-primary {
            background: var(--primary); color: white; border: none; padding: 14px; border-radius: var(--radius-pill);
            font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 10px; transition: 0.3s;
        }
        .btn-primary:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; transform: none; box-shadow: none; }

        @keyframes fadeInModal { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scaleInModal { from { opacity: 0; transform: scale(0.9) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }

        /* Loading Spinner */
        .loading-spinner {
            display: none; margin: 10px auto;
            border: 3px solid var(--card-border); border-top: 3px solid var(--primary);
            border-radius: 50%; width: 28px; height: 28px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- CANVAS MODE --- */
        #canvas-panel {
            width: 55%;
            display: none;
            flex-direction: column;
            background: var(--nav-bg);
            animation: slideInCanvas 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            min-width: 0;
            border-left: 1px solid var(--card-border);
            transition: all 0.3s ease;
        }
        
        #main-chat.canvas-active #canvas-panel { 
            display: flex; 
        }

        @keyframes slideInCanvas {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .canvas-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 20px; border-bottom: 1px solid var(--card-border);
            background: var(--card-bg);
            flex-shrink: 0;
        }
        .canvas-title {
            display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 0.95rem;
        }
        .canvas-title i { color: var(--primary); }
        .canvas-actions { display: flex; gap: 6px; }

        .canvas-body {
            flex: 1; overflow: hidden; display: flex; flex-direction: column; position: relative;
        }
        .canvas-tabs {
            display: flex; gap: 4px; padding: 8px 20px 0 20px; background: var(--card-bg);
            border-bottom: 1px solid var(--card-border);
        }
        .canvas-tab {
            padding: 8px 16px; border-radius: 10px 10px 0 0; cursor: pointer; font-size: 0.85rem;
            color: var(--desc-color); border: 1px solid transparent; border-bottom: none;
        }
        .canvas-tab.active {
            background: var(--bg-color); color: var(--primary); font-weight: bold;
            border-color: var(--card-border);
        }

        .canvas-code-view {
            flex: 1; overflow: auto; padding: 20px; background: #1e1e1e; margin: 0;
        }
        .canvas-code-view pre { margin: 0; box-shadow: none; }

        .canvas-preview-frame {
            flex: 1; border: none; width: 100%; background: white; display: none;
        }
        .canvas-story-view {
            flex: 1; overflow: auto; padding: 30px 40px; background: var(--bg-color);
            line-height: 1.8; font-size: 1.05rem;
        }

        /* --- FILE CARD IM CHATVERLAUF --- */
        .canvas-file-card {
            display: flex; align-items: center; gap: 14px; background: var(--card-bg);
            border: 1px solid var(--card-border); border-radius: var(--radius-md);
            padding: 14px 18px; cursor: pointer; transition: 0.2s; max-width: 320px;
            box-shadow: var(--shadow-sm);
        }
        .canvas-file-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .canvas-file-icon {
            width: 42px; height: 42px; border-radius: 10px; background: rgba(0,127,255,0.12);
            color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0;
        }
        .canvas-file-info { min-width: 0; }
        .canvas-file-title { font-weight: bold; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .canvas-file-sub { font-size: 0.75rem; color: var(--desc-color); }

        @media (max-width: 768px) {
            #main-chat { flex-direction: column; }
            #main-chat.canvas-active #chat-column { width: 100%; height: 40%; border-right: none; border-bottom: 1px solid var(--card-border); }
            #main-chat.canvas-active #canvas-panel { width: 100%; height: 60%; border-left: none; border-top: 1px solid var(--card-border); }
        }

        .bot .bubble, .user .bubble {
            width: fit-content;
            max-width: 80%;
        }
        .bubble p { margin: 0 0 8px 0; }
        .bubble p:last-child { margin-bottom: 0; }
        .bubble ul, .bubble ol { margin: 8px 0; padding-left: 20px; }
        .bubble { min-width: 0; }
        #chat-window { min-width: 0; }
    </style>
</head>
<body data-theme="auto">

<nav class="navbar">
    <button class="nav-btn" onclick="toggleSidebar('sidebar-left')"><i class="fas fa-bars"></i></button>
    <div class="nav-title"><img src="glamelogo.png" alt="Glame Pro" style="height: 102px; vertical-align: middle;"></div>
    <div class="auth-controls">
        <button class="btn-profile" id="user-profile-btn" onclick="openAuthModal()">
            <i class="fas fa-user-circle"></i> Login
        </button>
        <button class="nav-btn" onclick="toggleSidebar('sidebar-right')"><i class="fas fa-sliders-h"></i></button>
    </div>
</nav>

    <div class="app-container">
        <aside class="sidebar collapsed-left" id="sidebar-left">
            <button class="btn-new-chat" onclick="createNewChat()"><i class="fas fa-plus"></i> Neuer Chat</button>
            <div id="chat-list"></div>
        </aside>

        <main id="main-chat" class="canvas-inactive">
            <div id="chat-column">
                <div id="chat-window"></div>

                <div id="input-wrapper">
                    <div class="search-bar-container">
                        <!-- Bildvorschau -->
                        <div id="image-preview-box">
                            <img id="image-preview-img" src="" alt="Vorschau">
                            <i class="fas fa-times-circle close-preview" onclick="clearImage()"></i>
                        </div>

                        <!-- Hidden File Input für Bilder -->
                        <input type="file" id="image-file-input" accept="image/*" style="display: none;" onchange="handleImageSelection(event)">
                        
                        <button class="icon-btn" onclick="document.getElementById('image-file-input').click()" title="Bild anhängen">
                            <i class="fas fa-paperclip"></i>
                        </button>
                        
                        <textarea id="user-input" placeholder="Frag Glame etwas..." rows="1"></textarea>
                        
                        <button class="icon-btn" id="mic-btn"><i class="fas fa-microphone"></i></button>
                        <button class="icon-btn" id="send-btn" style="color: var(--primary)"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>

            <div id="canvas-panel">
                <div class="canvas-header">
                    <div class="canvas-title"><i class="fas fa-code" id="canvas-icon"></i> <span id="canvas-title-text">Canvas</span></div>
                    <div class="canvas-actions">
                        <button class="icon-btn" onclick="copyCanvasContent()" title="Kopieren"><i class="fas fa-copy"></i></button>
                        <button class="icon-btn" onclick="downloadCanvasContent()" title="Herunterladen"><i class="fas fa-download"></i></button>
                        <button class="icon-btn" onclick="closeCanvas()" title="Schliessen"><i class="fas fa-times"></i></button>
                    </div>
                </div>
                <div class="canvas-tabs" id="canvas-tabs" style="display:none;">
                    <div class="canvas-tab active" data-view="code" onclick="switchCanvasView('code')">Code</div>
                    <div class="canvas-tab" data-view="preview" onclick="switchCanvasView('preview')">Vorschau</div>
                </div>
                <div class="canvas-body">
                    <pre class="canvas-code-view" id="canvas-code-view"><code id="canvas-code-content"></code></pre>
                    <iframe class="canvas-preview-frame" id="canvas-preview-frame"></iframe>
                    <div class="canvas-story-view" id="canvas-story-view" style="display:none;"></div>
                </div>
            </div>
        </main>

        <aside class="sidebar collapsed-right" id="sidebar-right">
            <h3 style="margin-bottom: 20px;">Einstellungen</h3>

            <div class="input-options">
                <label class="toggle-switch">
                    <input type="checkbox" id="deep-research-toggle">
                    <span class="slider"></span> 
                    <small>Deep Research Modus</small>
                </label>
            </div>
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <span>🌐 Internet-Suche</span>
                <input type="checkbox" id="search-toggle">
            </div>

            <div style="background: rgba(0, 127, 255, 0.1); border: 1px solid var(--primary); border-radius: 15px; padding: 15px; margin-top: 5px; margin-bottom: 5px;">
                <p style="font-weight: bold; color: var(--primary); margin-bottom: 5px;">📌 WICHTIGE INFO</p>
                <p style="font-size: 0.85rem; line-height: 1.4; color: var(--text-color);">
                    Die Internet-Suche geht nur mit den GPT Modellen! Die Internet Suche ist nicht mit Deep Research kombinierbar!
                </p>
            </div>
            
            <div class="setting-group">
                <span class="setting-label">KI Modell</span>
                <select id="model-select">
                    <option value="openai/gpt-oss-20b">GPT OSS 20B</option>
                    <option value="openai/gpt-oss-120b">GPT OSS 120B</option>
                    <option value="qwen/qwen3.6-27b">Qwen 3.6 27B</option>
                </select>
            </div>

            <div class="setting-group">
                <span class="setting-label">Erscheinungsbild</span>
                <select id="theme-select">
                    <option value="auto">System folgen</option>
                    <option value="light">Hell</option>
                    <option value="dark">Dunkel</option>
                </select>
            </div>
        </aside>
    </div>

<!-- Login Modal -->
<div id="auth-modal" class="modal-overlay" style="display: none;">
    <div class="modal-card">

        <!-- Schritt 1: Link anfordern -->

</div>

<script>

    // Theme Logic
    document.getElementById("theme-select").onchange = (e) => {
        const val = e.target.value;
        if(val === "auto") document.body.removeAttribute("data-theme");
        else document.body.setAttribute("data-theme", val);
        localStorage.setItem("glame_v4_theme", val);
    };

    userInput.addEventListener("input", function() {
        this.style.height = "auto";
        this.style.height = this.scrollHeight + "px";
    });

    sendBtn.onclick = handleSend;
    userInput.onkeydown = (e) => { if(e.key === "Enter" && !e.shiftKey) { e.preventDefault(); handleSend(); }};

    // CANVAS MODE FUNCTIONS
    function openCanvas(title = "Code", type = "code") {
        const mainChat = document.getElementById("main-chat");
        mainChat.classList.remove("canvas-inactive");
        mainChat.classList.add("canvas-active");
        
        document.getElementById("canvas-title-text").textContent = title;
        
        if (type === "html" || type === "preview") {
            document.getElementById("canvas-tabs").style.display = "flex";
        } else {
            document.getElementById("canvas-tabs").style.display = "none";
        }
    }

    function closeCanvas() {
        const mainChat = document.getElementById("main-chat");
        mainChat.classList.remove("canvas-active");
        mainChat.classList.add("canvas-inactive");
    }

    function switchCanvasView(view) {
        const tabs = document.querySelectorAll(".canvas-tab");
        tabs.forEach(t => t.classList.remove("active"));
        document.querySelector(`[data-view="${view}"]`).classList.add("active");
        
        const codeView = document.getElementById("canvas-code-view");
        const previewFrame = document.getElementById("canvas-preview-frame");
        
        if (view === "code") {
            codeView.style.display = "block";
            previewFrame.style.display = "none";
        } else {
            codeView.style.display = "none";
            previewFrame.style.display = "block";
        }
    }

    function copyCanvasContent() {
        const content = document.getElementById("canvas-code-content").textContent;
        navigator.clipboard.writeText(content);
        alert("Inhalt kopiert!");
    }

    function downloadCanvasContent() {
        const content = document.getElementById("canvas-code-content").textContent;
        const blob = new Blob([content], { type: "text/plain" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "canvas-content.txt";
        a.click();
        URL.revokeObjectURL(url);
    }

    function showErrorNotification(msg) {
        const loader = document.querySelector(".loading-indicator");
        if (loader) loader.remove();
        addMsgUI("bot", `⚠️ **Info:** ${msg}`);
    }

    // ==========================================
    // BILD-SELEKTIONS-SYSTEM & AUTO MODEL SWITCH
    // ==========================================
    function handleImageSelection(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            attachedImage = e.target.result;
            const previewBox = document.getElementById("image-preview-box");
            const previewImg = document.getElementById("image-preview-img");
            previewImg.src = attachedImage;
            previewBox.style.display = "flex";

            const modelSelect = document.getElementById("model-select");
            modelSelect.value = "qwen/qwen3.6-27b";
            modelSelect.style.boxShadow = "0 0 15px var(--primary)";
            setTimeout(() => { modelSelect.style.boxShadow = "none"; }, 1000);
        };
        reader.readAsDataURL(file);
    }

    function clearImage() {
        attachedImage = null;
        document.getElementById("image-file-input").value = "";
        document.getElementById("image-preview-box").style.display = "none";
    }

    // Stub functions - ersetze mit deiner echten Implementierung
    function createNewChat() {
        const chatId = "chat_" + Date.now();
        allChats[chatId] = { title: "Neuer Chat", messages: [], date: Date.now() };
        currentId = chatId;
        localStorage.setItem("glame_v4_chats", JSON.stringify(allChats));
        localStorage.setItem("glame_v4_now", currentId);
        renderChatList();
        renderMessages();
    }

    function renderChatList() {
        const chatList = document.getElementById("chat-list");
        chatList.innerHTML = "";
        Object.entries(allChats).forEach(([id, chat]) => {
            const div = document.createElement("div");
            div.className = "chat-slot" + (id === currentId ? " active" : "");
            div.innerHTML = `<span>${chat.title}</span>`;
            div.onclick = () => { currentId = id; renderMessages(); renderChatList(); };
            chatList.appendChild(div);
        });
    }

    function renderMessages() {
        chatWindow.innerHTML = "";
        if (!allChats[currentId] || allChats[currentId].messages.length === 0) {
            chatWindow.innerHTML = `<div class="welcome-screen"><div class="welcome-title">Glame AI Pro</div><div class="welcome-subtitle">Starte einen neuen Chat!</div></div>`;
            return;
        }
        allChats[currentId].messages.forEach(msg => addMsgUI(msg.role, msg.content));
    }

    function addMsgUI(role, content, image = null) {
        const container = document.createElement("div");
        container.className = `msg-container ${role}`;
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        if (image) {
            const img = document.createElement("img");
            img.src = image;
            bubble.appendChild(img);
        }
        bubble.innerHTML += marked.parse(content);
        container.appendChild(bubble);
        chatWindow.appendChild(container);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function showLoadingIndicator() {
        const div = document.createElement("div");
        div.className = "loading-indicator";
        div.innerHTML = '<div class="typing-indicator"><span></span><span></span></div>';
        chatWindow.appendChild(div);
        chatWindow.scrollTop = chatWindow.scrollHeight;
        return div;
    }

    async function handleSend() {
        const text = userInput.value.trim();
        if ((!text && !attachedImage) || isTyping) return;
        isTyping = true;
        addMsgUI("user", text, attachedImage);
        userInput.value = "";
        clearImage();
        // Add your API call logic here
        isTyping = false;
    }

    function checkAuth() {
        renderChatList();
        renderMessages();
    }

    function openAuthModal() {
        document.getElementById("auth-modal").style.display = "flex";
    }

    function closeAuthModal() {
        document.getElementById("auth-modal").style.display = "none";
    }

    async function requestLoginLink() {
        // Implement login logic

    }

    function toggleSidebar(id) {
        const sidebar = document.getElementById(id);
        sidebar.classList.toggle(id === "sidebar-left" ? "collapsed-left" : "collapsed-right");
    }
</script>
