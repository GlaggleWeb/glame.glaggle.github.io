<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glame AI Pro</title>

    <meta name="description" content="Chatte mit Glame AI Pro kostenlos und ohne Login wähle zwischen über 5 KI Modellen aus!">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- APPWRITE SDK -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.0"></script>
    
    <style>
        /* --- KLASSISCHES GLAGGLE DESIGN --- */
        :root {
            --bg-color: #f8f9fa;
            --text-color: #202124;
            --nav-bg: #ffffff;
            --card-bg: #ffffff;
            --card-border: #e8eaed;
            --desc-color: #5f6368;
            --input-bg: #ffffff;
            --primary: #007FFF; /* Original Glaggle Blue */
            --danger: #EA4335;
            --glaggle-gradient: linear-gradient(135deg, #4285F4, #EA4335, #FBBC05, #34A853);
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-pill: 30px;
            --shadow-sm: 0 2px 5px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 15px rgba(0, 127, 255, 0.15);
            --shadow-hover: 0 10px 25px rgba(0, 127, 255, 0.25);
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg-color: #202124;
                --text-color: #e8eaed;
                --nav-bg: #303134;
                --card-bg: #303134;
                --card-border: #444444;
                --desc-color: #bdc1c6;
                --input-bg: #3c4043;
                --shadow-md: 0 4px 15px rgba(0,0,0,0.3);
            }
        }

        [data-theme="dark"] {
            --bg-color: #202124;
            --text-color: #e8eaed;
            --nav-bg: #303134;
            --card-bg: #303134;
            --card-border: #444444;
            --desc-color: #bdc1c6;
            --input-bg: #3c4043;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Arial Rounded MT Bold', 'Segoe UI', sans-serif;
            display: flex; 
            flex-direction: column; 
            height: 100vh;
            height: 100dvh; 
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        /* --- MOBILE OPTIMIERUNGEN --- */
        @media (max-width: 768px) {
            #chat-window { padding: 20px 5%; }
            #input-wrapper { padding: 0 5% 20px 5%; }
            .navbar { height: 60px; }
            .nav-title { font-size: 16px; }
            .sidebar { position: absolute; height: 100%; width: 80%; }
        }

        /* --- NAVBAR --- */
        .navbar {
            display: flex; align-items: center; justify-content: space-between;
            height: 70px; background-color: var(--nav-bg); padding: 0 20px;
            box-shadow: var(--shadow-sm); z-index: 1000; border-bottom: 1px solid var(--card-border);
        }
        .nav-btn {
            background: none; border: none; color: var(--text-color);
            font-size: 1.2rem; cursor: pointer; padding: 10px; border-radius: 50%;
            transition: background-color 0.2s, transform 0.1s;
        }
        .nav-btn:hover { background-color: var(--card-border); }
        .nav-btn:active { transform: scale(0.95); }
        .nav-title { font-size: 20px; font-weight: bold; background: var(--glaggle-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .auth-controls { display: flex; align-items: center; gap: 10px; }
        .btn-profile {
            background: var(--card-border); border: none; color: var(--text-color);
            padding: 8px 16px; border-radius: var(--radius-pill); font-weight: bold;
            cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.3s ease;
        }
        .btn-profile:hover { background: var(--primary); color: white; transform: scale(1.05); }

        /* --- LAYOUT --- */
        .app-container { display: flex; flex: 1; overflow: hidden; position: relative; }
        .sidebar {
            width: 300px; background-color: var(--nav-bg); display: flex; flex-direction: column;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 100; padding: 20px; overflow-y: auto;
        }
        #sidebar-left { border-right: 1px solid var(--card-border); }
        #sidebar-right { border-left: 1px solid var(--card-border); }
        .sidebar.collapsed-left { transform: translateX(-100%); position: absolute; height: 100%; }
        .sidebar.collapsed-right { transform: translateX(100%); position: absolute; right: 0; height: 100%; }

        .btn-new-chat {
            background: var(--primary); color: white; border: none; padding: 12px;
            border-radius: var(--radius-pill); font-weight: bold; cursor: pointer; margin-bottom: 20px;
            display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s;
        }
        .btn-new-chat:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }

        /* --- CHAT AREA --- */
        #main-chat { flex: 1; display: flex; flex-direction: column; background: var(--bg-color); min-width: 0; }
        #chat-window { flex: 1; overflow-y: auto; padding: 40px 10%; display: flex; flex-direction: column; gap: 24px; scroll-behavior: smooth; }

        .msg-container { 
            display: flex; 
            width: 100%; 
            animation: messagePop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); 
        }
        .msg-container.user { justify-content: flex-end; }
        
        .bubble {
            max-width: 80%; padding: 18px 24px; line-height: 1.6; font-size: 1rem; position: relative;
            transition: transform 0.2s ease;
        }
        .user .bubble { background: var(--input-bg); border-radius: 24px 24px 4px 24px; border: 1px solid var(--card-border); box-shadow: var(--shadow-sm); }
        .bot .bubble { background: var(--card-bg); border-radius: 24px 24px 24px 4px; border: 1px solid var(--card-border); box-shadow: var(--shadow-md); }
        
        .cursor { display: inline-block; width: 8px; height: 16px; background: var(--primary); margin-left: 4px; animation: blink 0.8s infinite; vertical-align: middle; }
        @keyframes blink { 50% { opacity: 0; } }
        
        @keyframes messagePop { 
            from { opacity: 0; transform: translateY(20px) scale(0.95); } 
            to { opacity: 1; transform: translateY(0) scale(1); } 
        }

        /* --- IMMERSIVE BEGRÜSSUNGEN MIT SCHWEBE-ANIMATION --- */
        .welcome-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; text-align: center; margin: auto 0; padding: 20px;
        }
        
        .welcome-title {
            font-size: 2.8rem; font-weight: 800; background: var(--glaggle-gradient);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 12px;
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1), floatGreeting 6s ease-in-out infinite 0.8s;
        }

        .welcome-subtitle {
            font-size: 1.25rem; color: var(--desc-color); 
            animation: slideUpFade 1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
            max-width: 500px; line-height: 1.5;
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes floatGreeting {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        /* --- FLÜSSIGE BOUNCING LOADING DOTS --- */
        .typing-indicator {
            display: flex; gap: 6px; align-items: center; padding: 12px 20px; background: var(--card-bg);
            border-radius: 20px; border: 1px solid var(--card-border); width: fit-content;
            animation: messagePop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .typing-indicator span {
            width: 8px; height: 8px; background: var(--primary); border-radius: 50%;
            animation: loadingBounce 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes loadingBounce {
            0%, 80%, 100% { transform: scale(0.3); opacity: 0.5; }
            40% { transform: scale(1.1); opacity: 1; }
        }

        /* --- INPUT-BEREICH --- */
        #input-wrapper { padding: 0 10% 40px 10%; background: linear-gradient(to top, var(--bg-color) 70%, transparent); }
        .search-bar-container {
            display: flex; align-items: flex-end; background: var(--input-bg);
            border: 1px solid var(--card-border); border-radius: var(--radius-pill);
            padding: 8px 20px; box-shadow: var(--shadow-md); transition: 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
        }
        .search-bar-container:focus-within { border-color: var(--primary); box-shadow: var(--shadow-hover); }
        #user-input { flex: 1; border: none; outline: none; padding: 12px 0; font-size: 1.1rem; background: transparent; color: var(--text-color); resize: none; max-height: 150px; font-family: inherit; }
        
        /* IMAGE PREVIEW SYSTEM */
        #image-preview-box {
            display: none; position: absolute; bottom: 75px; left: 20px; background: var(--card-bg);
            border: 1px solid var(--card-border); border-radius: var(--radius-md); padding: 8px;
            box-shadow: var(--shadow-hover); z-index: 100; align-items: center; gap: 8px;
            animation: messagePop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #image-preview-box img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }
        #image-preview-box .close-preview { cursor: pointer; color: var(--danger); font-size: 1.1rem; padding: 5px; }

        .icon-btn { background: none; border: none; cursor: pointer; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: var(--desc-color); transition: 0.2s; }
        .icon-btn:hover { background: var(--bg-color); color: var(--primary); transform: scale(1.05); }
        .icon-btn:active { transform: scale(0.95); }
        #mic-btn.active { color: white; background: var(--danger); animation: pulseRed 1s infinite; }
        @keyframes pulseRed { 0% { box-shadow: 0 0 0 0 rgba(234,67,53, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(234,67,53, 0); } 100% { box-shadow: 0 0 0 0 rgba(234,67,53, 0); } }

        .setting-group { margin-bottom: 25px; }
        .setting-label { font-size: 0.85rem; color: var(--desc-color); margin-bottom: 8px; display: block; font-weight: bold; }
        select, .styled-input { width: 100%; background: var(--input-bg); border: 1px solid var(--card-border); color: var(--text-color); padding: 12px; border-radius: var(--radius-md); outline: none; font-family: inherit; transition: all 0.3s ease; }
        select:focus, .styled-input:focus { border-color: var(--primary); }

        /* --- CODE BOX STYLING --- */
        pre {
            background: #1e1e1e !important;
            color: #dcdcdc;
            padding: 15px;
            border-radius: 12px;
            position: relative;
            margin: 15px 0;
            overflow-x: auto;
            border: 1px solid #444;
        }

        code {
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.95rem;
        }

        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .copy-btn:hover { background: var(--primary); }
        .copy-btn.copied { background: #34A853; }

        /* --- AUTH MODAL SYSTEM --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4);
            display: flex; align-items: center; justify-content: center; z-index: 2000; backdrop-filter: blur(8px);
            animation: fadeInModal 0.3s ease;
        }
        .modal-card {
            background: var(--nav-bg); padding: 35px; border-radius: var(--radius-lg); width: 90%; max-width: 400px;
            box-shadow: var(--shadow-hover); position: relative; display: flex; flex-direction: column; gap: 15px;
            border: 1px solid var(--card-border);
            animation: scaleInModal 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .modal-card h2 { margin-bottom: 5px; color: var(--text-color); text-align: center; font-size: 1.6rem; }
        .modal-card p.sub { text-align: center; font-size: 0.85rem; color: var(--desc-color); margin-top: -10px; margin-bottom: 5px; }
        .btn-primary {
            background: var(--primary); color: white; border: none; padding: 14px; border-radius: var(--radius-pill);
            font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 10px; transition: 0.3s;
        }
        .btn-primary:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; transform: none; box-shadow: none; }

        @keyframes fadeInModal { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scaleInModal { from { opacity: 0; transform: scale(0.9) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }

        /* Loading Spinner */
        .loading-spinner {
            display: none; margin: 10px auto;
            border: 3px solid var(--card-border); border-top: 3px solid var(--primary);
            border-radius: 50%; width: 28px; height: 28px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
    </style>
</head>
<body data-theme="auto">

    <nav class="navbar">

<!-- Login Modal -->

<script>
    // Magic Link Callback direkt beim Laden abfangen
(function checkMagicLinkCallback() {
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('userId') && urlParams.get('secret')) {
        openAuthModal(); // öffnet automatisch im Bestätigungs-Schritt
    }
})();
    // --- APPWRITE CONFIG (Gekoppelt mit deiner bestehenden DB) ---
    const client = new Appwrite.Client()
        .setEndpoint('https://cloud.appwrite.io/v1')
        .setProject('69fb638a002b7d03d829'); 

    const account = new Appwrite.Account(client);
    const databases = new Appwrite.Databases(client);

    const DB_ID = '69fb65330007c1a1af0a';
    const COLL_ACCOUNTS = 'accounts'; // Deine registrierten Profile
    const COLL_CHATS = 'glame_chats';  // Deine Cloud-Chats (Speichert jeweils bis zu 3)

    let currentUser = null;
    let glaggleProfile = null; 

    const API_KEY = "gsk_ImbDfvvSXzXJfw80" + "vZP5WGdyb3FYknkYv77z" + "RJZN3pfyA1PiRGWu";
    let attachedImage = null;
    let allChats = JSON.parse(localStorage.getItem("glame_v4_chats")) || {};
    let currentId = localStorage.getItem("glame_v4_now") || "chat_" + Date.now();
    let isTyping = false;

    // Typewriter Queue-Variablen für Live-Typing
    let typingQueue = "";
    let isTypingActive = false;
    let currentTypingSpeed = 10; 

    const chatWindow = document.getElementById("chat-window");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const micBtn = document.getElementById("mic-btn");

    // Init Logic
    if (!allChats[currentId]) createNewChat();
    checkAuth();

    // Theme Logic
    document.getElementById("theme-select").onchange = (e) => {
        const val = e.target.value;
        if(val === "auto") document.body.removeAttribute("data-theme");
        else document.body.setAttribute("data-theme", val);
        localStorage.setItem("glame_v4_theme", val);
    };

    userInput.addEventListener("input", function() {
        this.style.height = "auto";
        this.style.height = this.scrollHeight + "px";
    });

    sendBtn.onclick = handleSend;
    userInput.onkeydown = (e) => { if(e.key === "Enter" && !e.shiftKey) { e.preventDefault(); handleSend(); }};


    function showErrorNotification(msg) {
    // Entfernt eventuelle Lade-Indikatoren, damit die UI sauber ist
    const loader = document.querySelector(".loading-indicator");
    if (loader) loader.remove();
    
    // Zeigt den Hinweis als Chat-Nachricht
    addMsgUI("bot", `⚠️ **Info:** ${msg}`);
}
    // ==========================================
    // BILD-SELEKTIONS-SYSTEM & AUTO MODEL SWITCH
    // ==========================================
    function handleImageSelection(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            attachedImage = e.target.result;
            const previewBox = document.getElementById("image-preview-box");
            const previewImg = document.getElementById("image-preview-img");
            previewImg.src = attachedImage;
            previewBox.style.display = "flex";

            // AUTO-SWITCH ZU LLAMA 4 SCOUT WENN BILD HINZUGEFÜGT WIRD
            const modelSelect = document.getElementById("model-select");
            modelSelect.value = "qwen/qwen3.6-27b";
            
            // Kurzes, leuchtendes Feedback im UI, damit der User den Wechsel bemerkt
            modelSelect.style.boxShadow = "0 0 15px var(--primary)";
            setTimeout(() => { modelSelect.style.boxShadow = "none"; }, 1000);
        };
        reader.readAsDataURL(file);
    }

    function clearImage() {
        attachedImage = null;
        document.getElementById("image-file-input").value = "";
        document.getElementById("image-preview-box").style.display = "none";
    }

    // ==========================================
    // AUTH LOGIC & SYNC (FIXED LOGIN ORDER)
    // ==========================================
    async function checkAuth() {
        try {
            currentUser = await account.get();
            await fetchGlaggleProfile(currentUser.email);
            
            const displayHeaderName = glaggleProfile ? glaggleProfile.userName : currentUser.name;
            document.getElementById("user-profile-btn").innerHTML = `<i class="fas fa-sign-out-alt"></i> ${displayHeaderName}`;
            document.getElementById("user-profile-btn").onclick = logout;
            
            await loadChatsFromCloud();
        } catch (e) {
            currentUser = null;
            glaggleProfile = null;
            document.getElementById("user-profile-btn").innerHTML = `<i class="fas fa-user-circle"></i> Login`;
            document.getElementById("user-profile-btn").onclick = openAuthModal;
        }
        renderChatList();
        renderMessages();
    }

async function requestLoginLink() {
    const errorEl = document.getElementById("auth-error");
    const spinner = document.getElementById("auth-spinner");
    const btn = document.getElementById("btn-login");
    const input = document.getElementById("auth-identifier").value.trim();

    errorEl.innerText = "";
    if (!input) { errorEl.innerText = "Bitte gib einen Benutzernamen oder eine E-Mail ein."; return; }

    spinner.style.display = "block";
    btn.disabled = true;
    let targetEmail = "";

    try {
        if (input.includes('@')) {
            targetEmail = input;
        } else {
            const response = await databases.listDocuments(DB_ID, COLL_ACCOUNTS, [
                Appwrite.Query.equal('userName', input)
            ]);
            if (response.documents.length > 0) {
                targetEmail = response.documents[0].userEmail;
            } else {
                throw new Error("Konto wurde nicht gefunden.");
            }
        }

        try { await account.deleteSession('current'); } catch(e) {}

        const userId = Appwrite.ID.unique();
        await account.createMagicURLToken(userId, targetEmail, window.location.href);

        errorEl.style.color = "#34A853";
        errorEl.innerText = "E-Mail versendet! Bitte prüfe dein Postfach.";
        btn.disabled = true;
        btn.innerText = "Link gesendet...";

    } catch (error) {
        errorEl.style.color = "var(--danger)";
        errorEl.innerText = "Fehler: " + error.message;
        btn.disabled = false;
    } finally {
        spinner.style.display = "none";
    }
}

    async function loadChatsFromCloud() {
        if (!currentUser) return;
        try {
            const response = await databases.listDocuments(DB_ID, COLL_CHATS, [
                Appwrite.Query.equal('userId', currentUser.$id)
            ]);
            
            let loadedSomething = false;
            response.documents.forEach(doc => {

                    allChats[doc.chatId] = {
                        title: doc.title,
                        messages: JSON.parse(doc.messages),
                        date: doc.timestamp
                    };
                    loadedSomething = true;
                }
            });

            if (loadedSomething) {
                save();
                if (!allChats[currentId]) currentId = Object.keys(allChats)[0] || "chat_" + Date.now();
            }
        } catch (e) {
            console.log("Cloud-Chats noch leer oder noch nicht initialisiert.", e);
        }
    }

    async function syncChatsToCloud() {
        if (!currentUser) return;
        const chatIds = Object.keys(allChats).sort((a,b) => allChats[b].date - allChats[a].date).slice(0, 3);
        
        try {
            const response = await databases.listDocuments(DB_ID, COLL_CHATS, [
                Appwrite.Query.equal('userId', currentUser.$id)
            ]);

            const existingDocs = {};
            response.documents.forEach(doc => existingDocs[doc.chatId] = doc.$id);

            for (const id of chatIds) {
                const data = {
                    userId: currentUser.$id,
                    chatId: id,
                    title: allChats[id].title,
                    messages: JSON.stringify(allChats[id].messages),
                    timestamp: allChats[id].date
                };

                if (existingDocs[id]) {
                    await databases.updateDocument(DB_ID, COLL_CHATS, existingDocs[id], data);
                    delete existingDocs[id];
                } else {
                    await databases.createDocument(DB_ID, COLL_CHATS, Appwrite.ID.unique(), data);
                }
            }

            for (const docId of Object.values(existingDocs)) {
                await databases.deleteDocument(DB_ID, COLL_CHATS, docId);
            }
        } catch (e) {
            console.warn("Cloud-Sync fehlgeschlagen.", e);
        }
    }

    // ==========================================
    // HIGH-PERFORMANCE LIVE TYPEWRITER
    // ==========================================
    let currentTypingElement = null;
    let fullTypingContent = "";
    let displayedText = "";

    function initTypewriter(element) {
        currentTypingElement = element;
        fullTypingContent = "";
        displayedText = "";
        typingQueue = "";
        isTypingActive = true;
        animateTypewriter();
    }

    function feedTypewriter(text) {
        typingQueue += text;
        fullTypingContent += text;
    }

    function animateTypewriter() {
        if (!isTypingActive) return;

        if (typingQueue.length > 0) {
            const speed = typingQueue.length > 30 ? 2 : (typingQueue.length > 10 ? 5 : 12);
            
            const charToType = typingQueue.substring(0, 1);
            typingQueue = typingQueue.substring(1);
            displayedText += charToType;
            
            updateBubbleContent(currentTypingElement, displayedText + ' <span class="cursor"></span>');
            
            setTimeout(animateTypewriter, speed);
        } else {
            setTimeout(animateTypewriter, 20);
        }
    }

    async function flushTypewriter(finalText) {
        isTypingActive = false;
        updateBubbleContent(currentTypingElement, finalText);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function addMsgUI(role, content, image = null) {

        container.className = `msg-container ${role}`;

            updateBubbleContent(textDiv, content);
        }

        container.appendChild(bubble);
        chatWindow.appendChild(container);

    function updateBubbleContent(bubble, content) {
        bubble.innerHTML = marked.parse(content);
        
        if (window.Prism) {
            Prism.highlightAllUnder(bubble);
        }
        
        bubble.querySelectorAll('pre').forEach(block => {
            if (block.querySelector('.copy-btn')) return;

            const btn = document.createElement('button');
            btn.className = 'copy-btn';
            btn.innerHTML = '<i class="fas fa-copy"></i> Kopieren';
            
            btn.onclick = () => {
                const code = block.querySelector('code').innerText;
                navigator.clipboard.writeText(code).then(() => {
                    btn.innerHTML = '<i class="fas fa-check"></i> Kopiert!';
                    btn.classList.add('copied');
                    setTimeout(() => {
                        btn.innerHTML = '<i class="fas fa-copy"></i> Kopieren';
                        btn.classList.remove('copied');
                    }, 2000);
                });
            };
            block.appendChild(btn);
        });
    }

        // 2. Thumbnail-Grösse (iiurlwidth=500) und Metadaten anfordern
        // Dadurch erhalten wir die erlaubte "thumburl" anstelle der gesperrten Original-URL
        const infoUrl = `https://commons.wikimedia.org/w/api.php?action=query&titles=${encodeURIComponent(fileTitle)}&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=500&format=json&origin=*`;
        const infoRes = await fetch(infoUrl, { headers });
        const infoData = await infoRes.json();

        const pages = infoData.query.pages;
        const page = Object.values(pages)[0];
        if (!page.imageinfo) return;

        // WICHTIG: .thumburl nutzen, NICHT .url
        const imageUrl = page.imageinfo[0].thumburl || page.imageinfo[0].url;
        const meta = page.imageinfo[0].extmetadata || {};

        // HTML-Tags aus dem Autorennamen filtern (Wikimedia liefert dort oft HTML-Links)
        const author = meta.Artist ? meta.Artist.value.replace(/<[^>]*>/g, "").trim() : "Unbekannt";
        const license = meta.LicenseShortName ? meta.LicenseShortName.value : "Freie Lizenz";

        // 3. Element im Chat anzeigen
        const wrapper = document.createElement("div");
        wrapper.style.marginTop = "15px";
        wrapper.innerHTML = `
            <img src="${imageUrl}" style="max-width:100%; border-radius:12px; box-shadow: var(--shadow-sm);" alt="${query}">
            <p style="font-size:0.75rem; color: var(--desc-color); margin-top:6px; line-height: 1.3;">
                Foto: ${author} · Lizenz: ${license} · Quelle: Wikimedia Commons
            </p>
        `;
        bubbleElement.appendChild(wrapper);
        
        if (typeof chatWindow !== "undefined") {
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }
    } catch (e) {
        console.warn("Wikimedia-Bildsuche fehlgeschlagen:", e);
    }
}


</script>
</body>
</html>
